name: Build iOS IPA for free sideloading

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build an unsigned iPhone IPA
        run: bash scripts/build-ios-unsigned.sh
      - name: Save IPA, checksum and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RiverPoker-iOS-Unsigned
          path: release/
          if-no-files-found: error
          retention-days: 3
